name: Deploy To Lectureye Client To Production

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    name: Build and Deploy Lectureeye Client
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 20m
          script: |
            set -e

            echo "🚀 Starting Lectureye Client deployment..."

            if [ ! -d "${{ secrets.PROJECT_PATH }}" ]; then
              echo "📂 Client project not found, cloning..."
              git clone git@github.com:mjeledi/Fourth-Year-Frontend.git ${{ secrets.PROJECT_PATH }}
            fi

            cd ${{ secrets.PROJECT_PATH }}

            echo "🔄 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            echo "🐳 Pulling latest images (if any)..."
            docker compose pull || true

            echo "🔧 Rebuilding & starting containers..."
            docker compose up -d --build

            echo "🔁 Reloading Nginx (no downtime)..."
            docker exec vhb-nginx-proxy nginx -s reload || true

            echo "✅ Lectureye Client deployment complete"